baseURL: https://jacobhuff.io/
locale: en-us
title: Jacob Huff

module:
  imports:
  - path: github.com/adityatelange/hugo-PaperMod

markup:
  highlight:
    # Emit classes so assets/css/extended/eink.css can style code in ink only
    noClasses: false

caches:
  images:
    dir: :cacheDir/images

menu:
  main:
  - name: Projects
    pageRef: /projects
    weight: 10
  - name: About
    pageRef: /about
    weight: 20

params:
  # e-ink: paper only, no dark variant
  defaultTheme: light
  disableThemeToggle: true
  ShowReadingTime: true
  ShowBreadCrumbs: true
  ShowPostNavLinks: true
  homeInfoParams:
    Title: Hi, I'm Jacob
    Content: Welcome to my portfolio. Here you'll find projects I've built and a bit about me.
  socialIcons:
  - name: github
    url: https://github.com/jacobhuff-io
